<div class="app-shell container-fluid">
  <div class="row g-0 min-vh-100">
    <aside class="col-12 col-lg-3 col-xl-2 border-end bg-body-tertiary p-3 d-flex flex-column gap-3">
      <div class="d-flex align-items-start justify-content-between gap-2">
        <div>
          <p class="text-uppercase small text-body-secondary mb-1">Family Health Coach AI</p>
          <h1 class="h5 mb-0">Mock navigation</h1>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="logout()">
          Logout
        </button>
      </div>

      <app-family-switcher
        [families]="families"
        [selectedFamilyId]="selectedFamilyId"
      ></app-family-switcher>

      <nav class="nav nav-pills flex-column gap-1">
        @for (item of navItems; track item.link) {
          <a
            class="nav-link d-flex align-items-center gap-2"
            [routerLink]="item.link"
            routerLinkActive="active"
          >
            <i [class]="'bi ' + item.icon"></i>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    </aside>

    <section class="col-12 col-lg-9 col-xl-10 d-flex flex-column">
      <header class="border-bottom bg-body sticky-top">
        <div class="container-fluid py-3">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div>
              <p class="text-body-secondary small mb-1">Navigation flow</p>
              <h2 class="h6 mb-0">Jump between the mock screens</h2>
            </div>
            <div class="d-flex flex-wrap gap-2">
              <a class="btn btn-outline-primary btn-sm" routerLink="/families/new">New family</a>
              <a class="btn btn-outline-secondary btn-sm" routerLink="/chat">Open chat</a>
            </div>
          </div>
        </div>
      </header>

      <main class="flex-fill bg-body-tertiary">
        <router-outlet></router-outlet>
      </main>
    </section>
  </div>
</div>
