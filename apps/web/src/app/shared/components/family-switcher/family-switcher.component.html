<label class="form-label" for="familySwitcher">Family</label>
<select id="familySwitcher" class="form-select" [value]="selectedFamilyId ?? ''">
  <option value="">Select family</option>
  @for (family of families; track family.id) {
    <option [value]="family.id">{{ family.name }}</option>
  }
</select>
